<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>.SOLEVIA | Premium Footwear</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />

  <!-- AOS -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

  <style>
    * {
      font-family: 'Inter', sans-serif;
    }

    body {
      background: black;
      color: white;
      overflow-x: hidden;
    }

    .glass {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glass-card {
      background: rgba(15, 15, 25, 0.6);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.4s ease;
    }

    .card {
      transition: 0.4s ease;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      color: black;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 500;
      z-index: 9999;
      animation: toastUp 0.3s ease;
      font-size: 13px;
      white-space: nowrap;
    }

    @keyframes toastUp {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    .modal {
      background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(20px);
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    ::-webkit-scrollbar {
      width: 3px;
    }

    ::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 5px;
    }

    .floating-cart {
      position: fixed;
      bottom: 80px;
      right: 16px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffffff, #e0e0e0);
      color: black;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 55;
      box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2);
      font-size: 14px;
      font-weight: bold;
    }

    .floating-cart span {
      position: absolute;
      top: -5px;
      right: -5px;
      background: red;
      color: white;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: bold;
    }

    /* Status badges */
    .status-pending {
      background: #f59e0b;
      color: black;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: bold;
    }
    .status-confirmed {
      background: #3b82f6;
      color: white;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: bold;
    }
    .status-shipped {
      background: #8b5cf6;
      color: white;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: bold;
    }
    .status-delivered {
      background: #10b981;
      color: white;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: bold;
    }

    @media (max-width: 768px) {
      .glass-card {
        border-radius: 16px;
      }
      
      .toast {
        bottom: 70px;
        font-size: 12px;
        padding: 8px 16px;
        white-space: nowrap;
      }
      
      input, select, button {
        font-size: 16px !important;
      }
    }

    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus,
    input:-webkit-autofill:active {
      -webkit-box-shadow: 0 0 0 30px #1a1a1a inset !important;
      -webkit-text-fill-color: white !important;
    }
  </style>
</head>

<body class="pb-20 md:pb-0">

  <!-- NAVBAR -->
  <div id="navbar" class="fixed top-0 left-0 w-full z-50 bg-black/80 backdrop-blur-xl border-b border-white/10">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="text-xl md:text-2xl font-black tracking-tight cursor-pointer" 
        onclick="window.scrollTo({top:0,behavior:'smooth'})">
        .SOLEVIA
      </h1>

      <div class="hidden md:flex gap-2 items-center">
        <div id="auth-desktop" class="flex gap-2 items-center"></div>
        <button onclick="openOrderTracking()" class="glass px-4 py-2 rounded-lg text-sm font-semibold hover:bg-white/10 transition">
          ORDERS
        </button>
        <button onclick="toggleWishlistView()" class="glass px-4 py-2 rounded-lg text-sm font-semibold hover:bg-white/10 transition">
          WISHLIST (<span id="wishlist-count-nav">0</span>)
        </button>
        <button onclick="toggleCart()" class="glass px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 hover:bg-white/10 transition">
          CART <span id="cart-count" class="bg-white/20 px-2 py-0.5 rounded-full text-xs min-w-[22px]">0</span>
        </button>
      </div>
    </div>
  </div>

  <!-- MOBILE BOTTOM NAVIGATION -->
  <div class="md:hidden fixed bottom-0 left-0 w-full bg-black/90 backdrop-blur-2xl border-t border-white/10 z-[65] grid grid-cols-4 safe-bottom">
    <button onclick="window.scrollTo({top:0,behavior:'smooth'}); showMainProducts();" class="flex flex-col items-center justify-center py-3 text-zinc-400 active:text-white">
      <span class="text-lg">SHOP</span>
      <span class="text-[9px] font-bold mt-0.5">HOME</span>
    </button>
    <button onclick="toggleWishlistView()" class="flex flex-col items-center justify-center py-3 text-zinc-400 active:text-white relative">
      <span class="text-lg">WISH</span>
      <span class="text-[9px] font-bold mt-0.5">LIST</span>
      <span id="wishlist-count-mob" class="absolute top-1 right-8 bg-white text-black text-[8px] font-black rounded-full px-1.5 py-0.5 min-w-[16px] text-center">0</span>
    </button>
    <button onclick="toggleCart()" class="flex flex-col items-center justify-center py-3 text-zinc-400 active:text-white relative">
      <span class="text-lg">CART</span>
      <span id="cart-count-mob" class="absolute top-1 right-8 bg-red-600 text-white text-[8px] font-black rounded-full px-1.5 py-0.5 min-w-[16px] text-center">0</span>
    </button>
    <button onclick="openOrderTracking()" class="flex flex-col items-center justify-center py-3 text-zinc-400 active:text-white">
      <span class="text-lg">ORDER</span>
      <span class="text-[9px] font-bold mt-0.5">TRACK</span>
    </button>
  </div>

  <!-- FLOATING CART BUTTON -->
  <div class="hidden md:flex floating-cart" onclick="toggleCart()">
    CART <span id="floating-cart-count">0</span>
  </div>

  <!-- HERO SECTION -->
  <section id="hero-section" class="pt-20 md:pt-28 pb-8 px-4 relative">
    <div id="hero-banner" class="max-w-7xl mx-auto rounded-2xl md:rounded-3xl overflow-hidden relative bg-cover bg-center min-h-[300px] md:min-h-[450px] flex items-center transition-all duration-500"
      style="background-image: url('https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=1200&auto=format&fit=crop');">
      <div class="absolute inset-0 bg-black/40"></div>
      <div class="relative z-10 max-w-2xl p-5 md:p-10">
        <p id="banner-subtitle" class="uppercase tracking-wider text-zinc-300 text-[10px] md:text-xs mb-1 md:mb-2">Limited Release</p>
        <h1 id="banner-title" class="text-3xl md:text-6xl lg:text-7xl font-black leading-tight">FUTURE SNEAKERS</h1>
        <p id="banner-desc" class="text-zinc-200 text-sm md:text-base mt-2 max-w-lg">Premium sneakers engineered with futuristic aesthetics.</p>
        <button onclick="document.getElementById('products-container').scrollIntoView({behavior:'smooth'})"
          class="mt-4 md:mt-6 bg-white text-black px-5 py-2 md:px-6 md:py-3 rounded-full font-black text-sm md:text-base w-auto transition active:scale-95">
          EXPLORE NOW
        </button>
      </div>
      <div id="banner-dots" class="banner-dots absolute bottom-3 left-1/2 transform -translate-x-1/2 flex gap-2 z-20"></div>
    </div>
  </section>

  <!-- FILTER -->
  <section class="px-4 pb-4">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row gap-3">
      <input type="search" id="search" placeholder="Search products..." autocomplete="off" class="glass px-4 py-3 rounded-xl bg-transparent outline-none text-sm w-full">
      <select id="filter" class="glass px-4 py-3 rounded-xl bg-black outline-none text-sm cursor-pointer w-full md:w-48">
        <option value="all">All Categories</option>
        <option value="Running">Running</option>
        <option value="Streetwear">Streetwear</option>
        <option value="Basketball">Basketball</option>
      </select>
    </div>
  </section>

  <!-- PRODUCTS GRID -->
  <section id="products-container" class="px-4 pb-24">
    <div class="max-w-7xl mx-auto">
      <div class="flex justify-between items-center mb-4 md:mb-6">
        <h2 id="grid-title" class="text-2xl md:text-4xl font-black tracking-tighter">Latest Drops</h2>
        <div id="product-count" class="glass px-3 py-1.5 rounded-full text-xs font-bold">LOADING</div>
      </div>
      <div id="products" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-5">
        <div class="glass rounded-xl h-[280px] md:h-[350px] animate-pulse"></div>
      </div>
    </div>

  <!-- LOGIN MODAL -->
  <div id="login-modal" class="hidden fixed inset-0 z-[100] modal flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-zinc-900 rounded-2xl p-6 border border-white/10">
      <div class="flex justify-between items-center mb-5">
        <h2 class="text-xl md:text-2xl font-bold">Login</h2>
        <button onclick="closeLoginModal()" class="text-gray-400 hover:text-white text-2xl">&times;</button>
      </div>
      <div id="login-form">
        <div class="space-y-3">
          <input type="email" id="login-email" placeholder="Email address" autocomplete="off" class="w-full p-3 rounded-lg bg-white/10 border border-white/10 outline-none text-white text-base">
          <input type="password" id="login-password" placeholder="Password" autocomplete="new-password" class="w-full p-3 rounded-lg bg-white/10 border border-white/10 outline-none text-white text-base">
          <button onclick="handleLogin()" class="w-full bg-white text-black py-3 rounded-lg font-semibold hover:bg-gray-200 transition text-base">Login</button>
          <p class="text-center text-gray-400 text-sm">No account? <button onclick="switchToSignup()" class="text-white underline">Create account</button></p>
        </div>
      </div>
      <div id="signup-form" class="hidden">
        <div class="space-y-3">
          <input type="text" id="signup-name" placeholder="Full name" autocomplete="off" class="w-full p-3 rounded-lg bg-white/10 border border-white/10 outline-none text-white text-base">
          <input type="email" id="signup-email" placeholder="Email address" autocomplete="off" class="w-full p-3 rounded-lg bg-white/10 border border-white/10 outline-none text-white text-base">
          <input type="password" id="signup-password" placeholder="Password (min 6 characters)" autocomplete="new-password" class="w-full p-3 rounded-lg bg-white/10 border border-white/10 outline-none text-white text-base">
          <button onclick="handleSignup()" class="w-full bg-white text-black py-3 rounded-lg font-semibold hover:bg-gray-200 transition text-base">Create account</button>
          <p class="text-center text-gray-400 text-sm">Have an account? <button onclick="switchToLogin()" class="text-white underline">Login</button></p>
        </div>
      </div>
    </div>
  </div>

  <!-- ADDRESS MODAL -->
  <div id="address-modal" class="hidden fixed inset-0 z-[70] modal flex items-end md:items-center justify-center p-0 md:p-5">
    <div class="max-w-2xl w-full bg-zinc-950 rounded-t-2xl md:rounded-2xl p-5 md:p-8 max-h-[85vh] overflow-y-auto border-t border-white/10 md:border">
      <div class="flex justify-between items-center mb-5">
        <h2 class="text-xl md:text-2xl font-bold">Delivery Address</h2>
        <button onclick="closeAddressModal()" class="text-gray-400 text-2xl">&times;</button>
      </div>
      <div class="space-y-3">
        <input id="full-name" type="text" placeholder="Full name" autocomplete="off" class="w-full p-3 rounded-xl bg-white/10 border border-white/10 outline-none text-base">
        <input id="phone" type="tel" placeholder="Phone number" autocomplete="off" class="w-full p-3 rounded-xl bg-white/10 border border-white/10 outline-none text-base">
        <input id="address-line" type="text" placeholder="Street address" autocomplete="off" class="w-full p-3 rounded-xl bg-white/10 border border-white/10 outline-none text-base">
        <div class="grid grid-cols-2 gap-3">
          <input id="city" type="text" placeholder="City" autocomplete="off" class="w-full p-3 rounded-xl bg-white/10 border border-white/10 outline-none text-base">
          <input id="pincode" type="text" placeholder="Pincode" autocomplete="off" class="w-full p-3 rounded-xl bg-white/10 border border-white/10 outline-none text-base">
        </div>
        <button onclick="placeOrderWithAddress()" class="w-full bg-white text-black py-3 rounded-xl font-bold mt-4 transition active:scale-95 text-base">PLACE ORDER</button>
      </div>
    </div>
  </div>

  <!-- ORDERS MODAL - FIXED STATUS DISPLAY -->
  <div id="tracking-modal" class="hidden fixed inset-0 z-[70] modal flex items-end md:items-center justify-center p-0 md:p-5">
    <div class="max-w-4xl w-full bg-zinc-950 rounded-t-2xl md:rounded-2xl p-5 md:p-8 max-h-[80vh] overflow-y-auto border-t border-white/10 md:border">
      <div class="flex justify-between items-center mb-5 sticky top-0 bg-zinc-950 py-2">
        <h2 class="text-xl md:text-2xl font-bold">My Orders</h2>
        <button onclick="closeTrackingModal()" class="text-gray-400 text-2xl">&times;</button>
      </div>
      <div id="orders-list" class="space-y-3"></div>
    </div>
  </div>

  <!-- PRODUCT DETAIL MODAL -->
  <div id="modal" class="hidden fixed inset-0 z-50 modal flex items-end md:items-center justify-center p-0 md:p-5">
    <div class="max-w-4xl w-full bg-zinc-950 rounded-t-2xl md:rounded-2xl overflow-hidden max-h-[90vh] overflow-y-auto">
      <div class="relative h-[250px] md:h-[400px]">
        <img id="modal-image" class="w-full h-full object-cover">
        <button id="modal-wishlist-btn" class="absolute top-3 right-3 bg-black/60 backdrop-blur-md p-2 rounded-full text-lg border border-white/10">♡</button>
        <button onclick="closeModal()" class="absolute top-3 left-3 bg-black/60 backdrop-blur-md p-2 rounded-full text-lg border border-white/10">&times;</button>
      </div>
      <div class="p-5 pb-8">
        <p id="modal-category" class="uppercase text-zinc-500 text-xs tracking-wider"></p>
        <h2 id="modal-name" class="text-2xl md:text-3xl font-bold mt-1"></h2>
        <div class="mt-3 flex gap-2 items-center">
          <span id="modal-price" class="text-2xl font-bold"></span>
          <span id="modal-old" class="text-zinc-500 line-through text-sm"></span>
        </div>
        <p id="modal-desc" class="text-zinc-300 mt-3 leading-relaxed text-sm"></p>
        <button onclick="addToCart(selectedProduct)" class="w-full bg-white text-black py-3 rounded-xl font-bold mt-5 transition active:scale-95 text-base">ADD TO CART</button>
      </div>
    </div>
  </div>

  <!-- CART SIDEBAR -->
  <div id="cart" class="hidden fixed top-0 right-0 h-full w-full md:w-[400px] bg-black/95 backdrop-blur-2xl z-[60] border-l border-white/10 p-4 overflow-y-auto">
    <div class="flex justify-between items-center mb-4 sticky top-0 bg-black py-2">
      <h2 class="text-xl font-bold">Your Cart</h2>
      <button onclick="toggleCart()" class="text-gray-400 text-2xl">&times;</button>
    </div>
    <div id="cart-items" class="space-y-3"></div>
    
    <div class="mt-4 pt-3 border-t border-white/10">
      <p class="text-xs font-bold text-zinc-400 mb-2 uppercase">Promo code</p>
      <div class="flex gap-2">
        <input id="promo-input" type="text" placeholder="ENTER CODE" autocomplete="off" class="flex-1 bg-white/10 border border-white/10 px-3 py-2 rounded-lg outline-none text-xs uppercase">
        <button onclick="applyPromoCode()" class="bg-zinc-200 text-black px-3 py-2 rounded-lg font-bold text-xs">APPLY</button>
      </div>
      <div id="promo-status" class="text-xs mt-2 hidden"></div>
    </div>

    <div class="mt-4 pt-3 space-y-2 text-sm">
      <div class="flex justify-between"><span>Subtotal</span><span id="summary-subtotal">₹0</span></div>
      <div id="summary-promo-row" class="flex justify-between text-green-400 hidden"><span>Discount</span><span id="summary-promo-discount">-₹0</span></div>
      <div class="flex justify-between text-lg font-bold pt-2 border-t border-white/10">
        <span>TOTAL</span><span id="cart-total">₹0</span>
      </div>
      <button onclick="initiateCheckout()" class="w-full bg-white text-black py-3 rounded-xl font-bold text-sm mt-3 transition active:scale-95">CHECKOUT</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { 
      getAuth, 
      onAuthStateChanged, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      setDoc, 
      getDoc,
      collection,
      addDoc,
      query,
      where,
      getDocs
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getDatabase, ref, onValue, push, set, get, update, onChildChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCG7DV9nat_lH2ZmjIHu8uknePQyj8tcds",
      authDomain: "soleva-9c40a.firebaseapp.com",
      databaseURL: "https://soleva-9c40a-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "soleva-9c40a",
      storageBucket: "soleva-9c40a.firebasestorage.app",
      messagingSenderId: "711185136101",
      appId: "1:711185136101:web:57094dfc739fa66ac3170c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const firestore = getFirestore(app);

    const productsRef = ref(db, "products");
    const ordersRef = ref(db, "orders");

    let allProducts = [];
    let cart = [];
    let wishlist = [];
    let currentUser = null;
    let activePromo = null;
    let allOrders = [];
    
    let bannerImages = []; let bannerTitles = []; let bannerSubtitles = []; let bannerDescs = [];
    let currentBannerIndex = 0; let bannerInterval = null;
    let viewingWishlist = false;

    window.selectedProduct = null;

    function toast(msg, isError = false) {
      const el = document.createElement("div");
      el.className = "toast";
      el.style.background = isError ? "rgba(220,38,38,0.95)" : "white";
      el.style.color = isError ? "white" : "black";
      el.innerText = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2500);
    }

    function updateAuthUI() {
      const authDesktop = document.getElementById("auth-desktop");
      if (currentUser) {
        authDesktop.innerHTML = `
          <span class="text-sm text-zinc-300 hidden md:inline">${currentUser.email.split('@')[0]}</span>
          <button onclick="handleLogout()" class="glass px-3 py-1.5 md:px-4 md:py-2 rounded-lg text-xs md:text-sm font-semibold hover:bg-white/10 transition">LOGOUT</button>
        `;
      } else {
        authDesktop.innerHTML = `<button onclick="openLoginModal()" class="glass px-3 py-1.5 md:px-4 md:py-2 rounded-lg text-xs md:text-sm font-semibold hover:bg-white/10 transition">LOGIN</button>`;
      }
    }

    window.openLoginModal = () => {
      document.getElementById("login-modal").classList.remove("hidden");
      document.getElementById("login-form").style.display = "block";
      document.getElementById("signup-form").style.display = "none";
      document.getElementById("login-email").value = "";
      document.getElementById("login-password").value = "";
    };

    window.closeLoginModal = () => { document.getElementById("login-modal").classList.add("hidden"); };
    window.switchToSignup = () => { document.getElementById("login-form").style.display = "none"; document.getElementById("signup-form").style.display = "block"; };
    window.switchToLogin = () => { document.getElementById("login-form").style.display = "block"; document.getElementById("signup-form").style.display = "none"; };

    window.handleLogin = async () => {
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;
      if (!email || !password) { toast("Please enter email and password", true); return; }
      try {
        await signInWithEmailAndPassword(auth, email, password);
        toast("Login successful");
        closeLoginModal();
      } catch (error) { toast("Login failed: " + error.message, true); }
    };

    window.handleSignup = async () => {
      const name = document.getElementById("signup-name").value.trim();
      const email = document.getElementById("signup-email").value.trim();
      const password = document.getElementById("signup-password").value;
      if (!name || !email || !password) { toast("Please fill all fields", true); return; }
      if (password.length < 6) { toast("Password must be at least 6 characters", true); return; }
      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        await setDoc(doc(firestore, "users", userCredential.user.uid), { name, email, createdAt: new Date() });
        toast("Account created successfully");
        closeLoginModal();
      } catch (error) { toast("Signup failed: " + error.message, true); }
    };

    window.handleLogout = async () => {
      await signOut(auth);
      toast("Logged out");
      cart = [];
      wishlist = [];
      renderCart();
      filterAndRenderProducts();
    };

    async function loadWishlist() {
      if (!currentUser) { wishlist = []; updateWishlistCounters(); return; }
      try {
        const wishlistRef = doc(firestore, "wishlists", currentUser.uid);
        const wishlistSnap = await getDoc(wishlistRef);
        wishlist = wishlistSnap.exists() ? wishlistSnap.data().items || [] : [];
        updateWishlistCounters();
      } catch (error) { wishlist = []; }
    }

    async function saveWishlist() {
      if (!currentUser) return;
      try { await setDoc(doc(firestore, "wishlists", currentUser.uid), { items: wishlist, updatedAt: new Date() }); } catch (error) {}
    }

    window.toggleWishlist = async (productId) => {
      if (!currentUser) { toast("Please login first", true); openLoginModal(); return; }
      const idx = wishlist.indexOf(productId);
      if (idx > -1) { wishlist.splice(idx, 1); toast("Removed from wishlist"); } 
      else { wishlist.push(productId); toast("Added to wishlist"); }
      await saveWishlist();
      updateWishlistCounters();
      if (viewingWishlist) filterAndRenderProducts();
      if (window.selectedProduct && window.selectedProduct.id === productId) updateModalWishlistButton(productId);
    };

    function updateWishlistCounters() {
      const count = wishlist.length;
      if (document.getElementById("wishlist-count-nav")) document.getElementById("wishlist-count-nav").innerText = count;
      if (document.getElementById("wishlist-count-mob")) document.getElementById("wishlist-count-mob").innerText = count;
    }

    window.toggleWishlistView = () => {
      if (!currentUser) { toast("Please login to view wishlist", true); openLoginModal(); return; }
      viewingWishlist = !viewingWishlist;
      document.getElementById("grid-title").innerText = viewingWishlist ? "My Wishlist" : "Latest Drops";
      document.getElementById("hero-section").style.display = viewingWishlist ? "none" : "block";
      filterAndRenderProducts();
    };

    window.showMainProducts = () => { viewingWishlist = false; document.getElementById("grid-title").innerText = "Latest Drops"; document.getElementById("hero-section").style.display = "block"; filterAndRenderProducts(); };

    function updateModalWishlistButton(productId) {
      const btn = document.getElementById("modal-wishlist-btn");
      if (wishlist.includes(productId)) {
        btn.innerText = "♥";
        btn.className = "absolute top-3 right-3 bg-red-600 p-2 rounded-full text-lg border border-transparent";
      } else {
        btn.innerText = "♡";
        btn.className = "absolute top-3 right-3 bg-black/60 backdrop-blur-md p-2 rounded-full text-lg border border-white/10";
      }
      btn.onclick = () => window.toggleWishlist(productId);
    }

    function addToCart(product) {
      if (!currentUser) { toast("Please login first", true); openLoginModal(); return; }
      if (!product) return;
      const cartItem = { ...product, price: product.displayPrice || product.price };
      cart.push(cartItem);
      saveCart();
      renderCart();
      toast(`${product.name} added to cart`);
    }

    function saveCart() { if (currentUser) { localStorage.setItem(`cart_${currentUser.uid}`, JSON.stringify(cart)); } }
    function loadCart() { if (currentUser) { const saved = localStorage.getItem(`cart_${currentUser.uid}`); cart = saved ? JSON.parse(saved) : []; } else { cart = []; } renderCart(); }

    window.removeCartItem = (i) => { cart.splice(i, 1); saveCart(); renderCart(); };
    window.toggleCart = () => { document.getElementById("cart").classList.toggle("hidden"); renderCart(); };

    function renderCart() {
      const count = cart.length;
      if (document.getElementById("cart-count")) document.getElementById("cart-count").innerText = count;
      if (document.getElementById("cart-count-mob")) document.getElementById("cart-count-mob").innerText = count;
      if (document.getElementById("floating-cart-count")) document.getElementById("floating-cart-count").innerText = count;

      const itemsContainer = document.getElementById("cart-items");
      if (!cart.length) {
        itemsContainer.innerHTML = `<div class="text-center text-zinc-500 py-8 text-sm">Your cart is empty</div>`;
        document.getElementById("summary-promo-row").classList.add("hidden");
        activePromo = null;
      } else {
        itemsContainer.innerHTML = cart.map((item, i) => `
          <div class="glass p-3 rounded-xl flex gap-3 items-center">
            <img src="${item.image}" class="w-14 h-14 rounded-lg object-cover">
            <div class="flex-1"><h3 class="font-bold text-sm">${item.name}</h3><p class="text-zinc-400 text-xs">₹${item.price.toLocaleString()}</p></div>
            <button onclick="removeCartItem(${i})" class="text-zinc-500 hover:text-white px-2 text-lg">&times;</button>
          </div>
        `).join("");
      }

      const subtotal = cart.reduce((sum, item) => sum + item.price, 0);
      document.getElementById("summary-subtotal").innerText = `₹${subtotal.toLocaleString()}`;

      let total = subtotal;
      if (activePromo) {
        let discountVal = activePromo.type === "percentage" ? Math.floor(subtotal * (activePromo.value / 100)) : activePromo.value;
        total = Math.max(0, subtotal - discountVal);
        document.getElementById("summary-promo-discount").innerText = `-₹${discountVal.toLocaleString()}`;
        document.getElementById("summary-promo-row").classList.remove("hidden");
      } else {
        document.getElementById("summary-promo-row").classList.add("hidden");
      }
      document.getElementById("cart-total").innerText = `₹${total.toLocaleString()}`;
    }

    window.applyPromoCode = () => {
      const input = document.getElementById("promo-input").value.trim().toUpperCase();
      const statusEl = document.getElementById("promo-status");
      if (!input) { toast("Enter a code", true); return; }
      if (cart.length === 0) { toast("Cart is empty", true); return; }
      if (input === "SOLEVA10") {
        activePromo = { code: "SOLEVA10", type: "percentage", value: 10 };
        statusEl.className = "text-xs mt-2 text-green-400";
        statusEl.innerText = "10% discount applied!";
      } else if (input === "FUTURE20") {
        activePromo = { code: "FUTURE20", type: "percentage", value: 20 };
        statusEl.className = "text-xs mt-2 text-green-400";
        statusEl.innerText = "20% discount applied!";
      } else {
        statusEl.className = "text-xs mt-2 text-red-400";
        statusEl.innerText = "Invalid code";
        activePromo = null;
      }
      renderCart();
    };

    function loadBanners() {
      onValue(ref(db, "storeSettings/bannerCarousel"), (snapshot) => {
        if (snapshot.exists() && snapshot.val().banners && snapshot.val().banners.length > 0) {
          const banners = snapshot.val().banners;
          bannerImages = banners.map(b => b.image).slice(0, 5);
          bannerTitles = banners.map(b => b.title || "SALE").slice(0, 5);
        } else {
          bannerImages = ["https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=1200&auto=format&fit=crop"];
          bannerTitles = ["FUTURE SNEAKERS"];
        }
        createBannerDots(); startBannerRotation(); updateBannerDisplay();
      });
    }

    function createBannerDots() {
      const dotsContainer = document.getElementById("banner-dots");
      if (!dotsContainer) return; 
      dotsContainer.innerHTML = "";
      for (let i = 0; i < bannerImages.length; i++) {
        const dot = document.createElement("div");
        dot.className = "w-1.5 h-1.5 rounded-full bg-white/50 transition-all cursor-pointer" + (i === currentBannerIndex ? " w-4 bg-white" : "");
        dot.onclick = () => goToBanner(i);
        dotsContainer.appendChild(dot);
      }
    }

    function goToBanner(index) { currentBannerIndex = index; updateBannerDisplay(); createBannerDots(); }
    function updateBannerDisplay() {
      const heroSection = document.getElementById("hero-banner");
      if (heroSection && bannerImages[currentBannerIndex]) heroSection.style.backgroundImage = `url('${bannerImages[currentBannerIndex]}')`;
      if (document.getElementById("banner-title") && bannerTitles[currentBannerIndex]) document.getElementById("banner-title").innerText = bannerTitles[currentBannerIndex];
    }
    function startBannerRotation() { if (bannerInterval) clearInterval(bannerInterval); if (bannerImages.length > 1) bannerInterval = setInterval(() => { currentBannerIndex = (currentBannerIndex + 1) % bannerImages.length; updateBannerDisplay(); createBannerDots(); }, 5000); }

    const DEMO_PRODUCTS = [
      { id: "demo1", name: "NEO ZENITH", category: "Streetwear", price: 18999, image: "https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?q=80&w=500&auto=format", description: "Futuristic silhouette with breathable mesh upper." },
      { id: "demo2", name: "ORBIT PRO", category: "Running", price: 15999, image: "https://images.unsplash.com/photo-1608231387042-66d1773070a5?q=80&w=500&auto=format", description: "Carbon-fiber propulsion plate for speed." },
      { id: "demo3", name: "SHADOW MESH", category: "Basketball", price: 20999, image: "https://images.unsplash.com/photo-1606107557195-0e29a4b5b4aa?q=80&w=500&auto=format", description: "High-top support with impact absorption." }
    ];

    onValue(productsRef, (snapshot) => {
      const data = snapshot.val();
      allProducts = data && Object.keys(data).length > 0 ? Object.keys(data).map(id => ({ id, ...data[id] })) : DEMO_PRODUCTS;
      filterAndRenderProducts();
    });

    // Listen for order status updates from admin
    function listenForOrderUpdates() {
      onChildChanged(ordersRef, (snapshot) => {
        const updatedOrder = { id: snapshot.key, ...snapshot.val() };
        if (updatedOrder.customerId === currentUser?.uid) {
          const orderIndex = allOrders.findIndex(o => o.id === updatedOrder.id);
          if (orderIndex !== -1) {
            allOrders[orderIndex] = updatedOrder;
          } else {
            allOrders.push(updatedOrder);
          }
          renderOrdersList();
          toast(`Order ${updatedOrder.orderId} status updated to ${updatedOrder.status}`);
        }
      });
    }

    function filterAndRenderProducts() {
      const searchQuery = document.getElementById("search").value.toLowerCase();
      const categoryFilter = document.getElementById("filter").value;
      const filtered = allProducts.filter(product => {
        const matchesSearch = product.name.toLowerCase().includes(searchQuery) || product.category.toLowerCase().includes(searchQuery);
        const matchesCategory = categoryFilter === "all" || product.category === categoryFilter;
        const matchesWishlist = !viewingWishlist || (currentUser && wishlist.includes(product.id));
        return matchesSearch && matchesCategory && matchesWishlist;
      });
      renderProducts(filtered);
    }

    function renderProducts(products) {
      if (document.getElementById("product-count")) document.getElementById("product-count").innerText = `${products.length}`;
      const productsContainer = document.getElementById("products");
      if (!products.length) { productsContainer.innerHTML = `<div class="col-span-full text-center py-10 text-zinc-400 text-sm">No items found</div>`; return; }
      productsContainer.innerHTML = products.map(product => {
        const isWishlisted = currentUser && wishlist.includes(product.id);
        return `<div class="card glass-card rounded-xl overflow-hidden relative"><button onclick="event.stopPropagation(); window.toggleWishlist('${product.id}')" class="absolute top-2 right-2 z-20 bg-black/50 p-1.5 rounded-full backdrop-blur-md text-sm">${isWishlisted ? "♥" : "♡"}</button><div onclick="openModal('${product.id}')"><img src="${product.image}" class="w-full h-40 md:h-52 object-cover"><div class="p-3"><p class="text-zinc-500 text-[10px] uppercase tracking-wide">${product.category}</p><h3 class="text-sm font-bold mt-0.5">${product.name}</h3><p class="text-base font-bold mt-1">₹${product.price.toLocaleString()}</p><button onclick="event.stopPropagation(); addToCart(${JSON.stringify(product)})" class="w-full bg-white text-black py-1.5 rounded-lg font-semibold text-xs mt-2 transition active:scale-95">ADD TO CART</button></div></div></div>`;
      }).join("");
      if (window.AOS) AOS.init();
    }

    window.openModal = (id) => {
      const product = allProducts.find(p => p.id == id);
      if (!product) return;
      window.selectedProduct = { ...product };
      document.getElementById("modal").classList.remove("hidden");
      document.getElementById("modal-image").src = product.image;
      document.getElementById("modal-category").innerText = product.category;
      document.getElementById("modal-name").innerText = product.name;
      document.getElementById("modal-price").innerHTML = `₹${product.price.toLocaleString()}`;
      document.getElementById("modal-desc").innerText = product.description || "Premium production model.";
      window.selectedProduct.displayPrice = product.price;
      if (currentUser) updateModalWishlistButton(product.id);
    };

    window.closeModal = () => { document.getElementById("modal").classList.add("hidden"); };
    window.addToCart = addToCart;

    window.initiateCheckout = () => {
      if (!currentUser) { toast("Please login to checkout", true); openLoginModal(); return; }
      if (cart.length === 0) { toast("Cart empty", true); return; }
      document.getElementById("address-modal").classList.remove("hidden");
      document.getElementById("full-name").value = "";
      document.getElementById("phone").value = "";
      document.getElementById("address-line").value = "";
      document.getElementById("city").value = "";
      document.getElementById("pincode").value = "";
    };

    window.closeAddressModal = () => { document.getElementById("address-modal").classList.add("hidden"); };

    // FIXED: Order placement with correct status "pending" not "Confirmed"
    window.placeOrderWithAddress = async () => {
      const fullName = document.getElementById("full-name").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const address = document.getElementById("address-line").value.trim();
      const city = document.getElementById("city").value.trim();
      const pincode = document.getElementById("pincode").value.trim();
      
      if (!fullName || !phone || !address || !city || !pincode) { toast("Please complete all address fields", true); return; }
      
      const addressData = { fullName, phone, address, city, pincode };
      let totalAmount = cart.reduce((sum, item) => sum + item.price, 0);
      
      if (activePromo) {
        if (activePromo.type === "percentage") totalAmount = Math.floor(totalAmount * (1 - activePromo.value / 100));
        else if (activePromo.type === "fixed") totalAmount = Math.max(0, totalAmount - activePromo.value);
      }
      
      const orderData = {
        items: cart.map(i => ({ name: i.name, price: i.price, id: i.id })),
        total: totalAmount,
        address: addressData,
        customerId: currentUser.uid,
        customerEmail: currentUser.email,
        createdAt: Date.now(),
        status: "pending",  // FIXED: Status is "pending" not "Confirmed"
        orderId: "ORD" + Date.now().toString().slice(-8)
      };

      await push(ordersRef, orderData);
      toast("Order placed successfully! Status: Pending");
      cart = []; 
      activePromo = null;
      saveCart();
      document.getElementById("promo-input").value = "";
      document.getElementById("promo-status").classList.add("hidden");
      renderCart(); 
      closeAddressModal();
      document.getElementById("cart").classList.add("hidden");
    };

    // FIXED: Orders list with proper status display
    async function renderOrdersList() {
      if (!currentUser) return;
      
      const snapshot = await get(ordersRef);
      const ordersList = document.getElementById("orders-list");
      
      if (snapshot.exists()) {
        const myOrders = [];
        snapshot.forEach(child => {
          const o = child.val();
          if (o.customerId === currentUser.uid) myOrders.push({ id: child.key, ...o });
        });
        myOrders.sort((a,b) => b.createdAt - a.createdAt);
        
        if (!myOrders.length) {
          ordersList.innerHTML = `<div class="text-center py-8 text-zinc-500 text-sm">No orders yet</div>`;
        } else {
          ordersList.innerHTML = myOrders.map(o => {
            let statusClass = "status-pending";
            if (o.status === "confirmed") statusClass = "status-confirmed";
            else if (o.status === "shipped") statusClass = "status-shipped";
            else if (o.status === "delivered") statusClass = "status-delivered";
            
            return `<div class="glass p-3 rounded-xl">
              <div class="flex justify-between items-center mb-2">
                <span class="font-mono text-xs text-zinc-400">${o.orderId}</span>
                <span class="${statusClass}">${(o.status || 'pending').toUpperCase()}</span>
              </div>
              <p class="text-[10px] text-zinc-500 mb-2">${new Date(o.createdAt).toLocaleString()}</p>
              <div class="border-t border-white/5 pt-2 space-y-1">
                ${o.items ? o.items.map(i => `<div class="flex justify-between text-xs"><span>${i.name}</span><span>₹${i.price.toLocaleString()}</span></div>`).join("") : ""}
              </div>
              <div class="border-t border-white/5 mt-2 pt-2 flex justify-between font-bold text-sm">
                <span>Total</span>
                <span>₹${o.total?.toLocaleString() || 0}</span>
              </div>
              <div class="text-[10px] text-zinc-500 mt-2">
                Delivery to: ${o.address?.fullName}, ${o.address?.city}
              </div>
            </div>`;
          }).join("");
        }
      } else {
        ordersList.innerHTML = `<div class="text-center py-8 text-zinc-500 text-sm">No orders found</div>`;
      }
    }

    window.openOrderTracking = async () => {
      if (!currentUser) { toast("Please login to view orders", true); openLoginModal(); return; }
      document.getElementById("tracking-modal").classList.remove("hidden");
      await renderOrdersList();
    };

    window.closeTrackingModal = () => { document.getElementById("tracking-modal").classList.add("hidden"); };

    document.getElementById("search").addEventListener("input", filterAndRenderProducts);
    document.getElementById("filter").addEventListener("change", filterAndRenderProducts);

    onAuthStateChanged(auth, async (user) => {
      currentUser = user;
      updateAuthUI();
      if (user) { 
        await loadWishlist(); 
        loadCart(); 
        filterAndRenderProducts();
        await renderOrdersList();
      } else { 
        wishlist = []; 
        cart = []; 
        updateWishlistCounters(); 
        renderCart(); 
        filterAndRenderProducts();
      }
    });

    loadBanners(); 
    updateWishlistCounters();
    listenForOrderUpdates();
  </script>
</body>
</html>
