<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Soleva | Luxury Sneakers</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      font-family: "Inter", sans-serif;
    }

    body {
      background: #000;
      color: white;
      overflow-x: hidden;
    }

    .glass {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .product-card {
      transition: 0.4s ease;
    }

    .product-card:hover {
      transform: translateY(-8px);
    }

    .product-card img {
      transition: 0.7s ease;
    }

    .product-card:hover img {
      transform: scale(1.08);
    }

    .hero-video {
      object-fit: cover;
      filter: brightness(0.45);
    }

    .fade-up {
      animation: fadeUp 0.8s ease forwards;
      opacity: 0;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }

      to {
        opacity: 1;
        transform: translateY(0px);
      }
    }

    ::-webkit-scrollbar {
      width: 5px;
    }

    ::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 999px;
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav
    class="fixed top-0 left-0 w-full z-50 bg-black/70 backdrop-blur-xl border-b border-white/10"
  >

    <div
      class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center"
    >

      <div class="flex items-center gap-3">

        <div class="w-3 h-3 rounded-full bg-white"></div>

        <h1 class="text-3xl font-black tracking-tight">
          SOLEVA
        </h1>

      </div>

      <button
        class="border border-white/10 px-5 py-2 rounded-full hover:bg-white hover:text-black transition"
      >
        Cart
      </button>

    </div>

  </nav>

  <!-- HERO -->
  <section class="relative h-screen overflow-hidden">

    <video
      autoplay
      muted
      loop
      playsinline
      class="absolute inset-0 w-full h-full hero-video"
    >
      <source
        src="https://cdn.pixabay.com/video/2023/10/26/186336-877168281_large.mp4"
        type="video/mp4"
      />
    </video>

    <div
      class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent"
    ></div>

    <div
      class="relative z-10 h-full flex items-center"
    >

      <div
        class="max-w-7xl mx-auto px-6 w-full"
      >

        <div class="max-w-3xl">

          <div
            class="glass inline-flex items-center gap-3 px-5 py-3 rounded-full mb-8 fade-up"
          >

            <div class="w-2 h-2 rounded-full bg-white animate-pulse"></div>

            <span class="text-sm text-zinc-300">
              Premium Limited Collection
            </span>

          </div>

          <h1
            class="text-6xl md:text-8xl font-black leading-none tracking-tight fade-up"
            style="animation-delay:.15s"
          >
            DEFINE
            <br />
            YOUR
            <br />
            STRIDE.
          </h1>

          <p
            class="text-zinc-300 text-lg mt-8 max-w-xl fade-up"
            style="animation-delay:.3s"
          >
            Luxury sneaker silhouettes crafted for modern streetwear culture.
          </p>

        </div>

      </div>

    </div>

  </section>

  <!-- PRODUCTS -->
  <section
    class="max-w-7xl mx-auto px-6 py-24"
  >

    <div
      class="flex flex-col md:flex-row md:items-end md:justify-between gap-6 mb-14"
    >

      <div>

        <p class="text-zinc-500 uppercase tracking-[0.3em] text-xs mb-4">
          Live Collection
        </p>

        <h2 class="text-5xl md:text-7xl font-black leading-none">
          Iconic
          <br />
          Drops.
        </h2>

      </div>

      <p class="text-zinc-400 max-w-md">
        Products update instantly from the admin panel using Firebase realtime database.
      </p>

    </div>

    <div
      id="products-container"
      class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-8"
    ></div>

  </section>

  <!-- PRODUCT MODAL -->
  <div
    id="product-modal"
    class="fixed inset-0 bg-black/90 backdrop-blur-xl hidden items-center justify-center z-50 p-6"
  >

    <div
      class="glass max-w-6xl w-full rounded-[40px] overflow-hidden grid md:grid-cols-2"
    >

      <!-- IMAGE -->
      <div class="bg-zinc-900">

        <img
          id="modal-image"
          class="w-full h-full object-cover"
        />

      </div>

      <!-- DETAILS -->
      <div class="p-10 md:p-14 flex flex-col justify-center">

        <p
          id="modal-category"
          class="uppercase tracking-[0.3em] text-zinc-500 text-xs mb-5"
        ></p>

        <h2
          id="modal-name"
          class="text-5xl md:text-6xl font-black leading-none"
        ></h2>

        <p
          id="modal-description"
          class="text-zinc-300 mt-8 leading-relaxed"
        ></p>

        <div class="flex items-center gap-4 mt-10">

          <span
            id="modal-price"
            class="text-5xl font-black"
          ></span>

          <span
            id="modal-old-price"
            class="text-zinc-500 line-through text-xl"
          ></span>

        </div>

        <div class="flex gap-4 mt-12">

          <button
            class="flex-1 bg-white text-black py-4 rounded-full font-bold hover:scale-[1.03] transition"
          >
            BUY NOW
          </button>

          <button
            onclick="closeModal()"
            class="px-8 border border-white/10 rounded-full hover:bg-white hover:text-black transition"
          >
            Close
          </button>

        </div>

      </div>

    </div>

  </div>

  <!-- FIREBASE -->
  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getDatabase,
      ref,
      onValue
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBG1tSV-VTEPquRCi-6KIzmz5Q-q-jbR34",
      authDomain: "circles-teen2.firebaseapp.com",
      databaseURL: "https://circles-teen2-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "circles-teen2",
      storageBucket: "circles-teen2.firebasestorage.app",
      messagingSenderId: "483867501706",
      appId: "1:483867501706:web:b6a7b390820cc53cd53973"
    };

    const app = initializeApp(firebaseConfig);

    const db = getDatabase(app);

    const productsRef = ref(db, "products");

    const container = document.getElementById("products-container");

    let allProducts = [];

    onValue(productsRef, (snapshot) => {

      const data = snapshot.val();

      if (!data) {
        container.innerHTML = `
          <div class="text-zinc-500 text-xl">
            No products found.
          </div>
        `;
        return;
      }

      allProducts = [];

      for (let id in data) {

        allProducts.push({
          id,
          ...data[id]
        });

      }

      renderProducts();

    });

    function renderProducts() {

      container.innerHTML = allProducts.map(product => `

        <div
          onclick="openProduct('${product.id}')"
          class="product-card glass rounded-[30px] overflow-hidden cursor-pointer"
        >

          <div class="overflow-hidden">

            <img
              src="${product.image}"
              class="w-full h-[360px] object-cover"
            />

          </div>

          <div class="p-6">

            <p class="text-zinc-500 text-sm">
              ${product.category}
            </p>

            <h2 class="text-3xl font-black mt-2">
              ${product.name}
            </h2>

            <div class="flex items-center gap-3 mt-5">

              <span class="text-3xl font-black">
                ₹${product.price}
              </span>

              <span class="text-zinc-500 line-through">
                ₹${product.oldPrice}
              </span>

            </div>

            <div class="mt-5 text-sm text-zinc-400">
              ${product.stock} pairs left
            </div>

          </div>

        </div>

      `).join("");

    }

    window.openProduct = function(id) {

      const product = allProducts.find(p => p.id === id);

      document.getElementById("modal-image").src = product.image;

      document.getElementById("modal-category").innerText = product.category;

      document.getElementById("modal-name").innerText = product.name;

      document.getElementById("modal-description").innerText = product.description;

      document.getElementById("modal-price").innerText = `₹${product.price}`;

      document.getElementById("modal-old-price").innerText = `₹${product.oldPrice}`;

      const modal = document.getElementById("product-modal");

      modal.classList.remove("hidden");

      modal.classList.add("flex");

    }

    window.closeModal = function() {

      const modal = document.getElementById("product-modal");

      modal.classList.add("hidden");

      modal.classList.remove("flex");

    }

  </script>

</body>
</html>
